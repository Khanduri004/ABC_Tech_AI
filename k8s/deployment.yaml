apiVersion: apps/v1
kind: Deployment
metadata:
  name: abc-retail
  namespace: abc-retail
  labels:
    app: abc-retail
    tier: web
    environment: dev
spec:
  # The DAO is in-memory, so more than one pod would have inconsistent state.
  replicas: 1
  selector:
    matchLabels:
      app: abc-retail
      tier: web
      environment: dev
  template:
    metadata:
      labels:
        app: abc-retail
        tier: web
        environment: dev
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: abc-retail
          image: abc-retail-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
